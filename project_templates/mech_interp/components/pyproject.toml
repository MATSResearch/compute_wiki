[project]
name = "mi-components"
version = "0.2.0"
description = "Project-agnostic mechanistic interpretability building blocks (model loading, hooks, run dirs, training loop)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17.0"]
transformer-lens = ["transformer_lens>=2.0.0"]
viz = ["matplotlib>=3.8.0"]
dev = ["pytest>=8.0.0", "matplotlib>=3.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mi_components"]
