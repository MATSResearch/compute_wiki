[project]
name = "example-2-vpd"
version = "0.1.0"
description = "Toy replication of VPD (Adversarial Parameter Decomposition; Bushnaq et al. 2026)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "numpy>=1.26.0",
    "mi-components",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.uv.sources]
mi-components = { path = "../../components", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_2_vpd"]
