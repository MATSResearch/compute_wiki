[project]
name = "md-components"
version = "0.1.0"
description = "Project-agnostic building blocks for model diffing (base vs finetuned): pair compatibility checks, per-token KL divergence, paired activation collection, difference directions and logit-lens readout, control-finetune comparison."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only `kl`, `acts` and `difflens` need torch; `pairing`, `ranking`, `control`,
# `runs` and `io` are pure Python so the analysis runs anywhere.
torch = ["torch>=2.4.0", "transformers>=4.40.0"]
viz = ["matplotlib>=3.8.0"]
dev = ["pytest>=8.0.0", "torch>=2.4.0", "transformers>=4.40.0", "matplotlib>=3.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md_components"]
