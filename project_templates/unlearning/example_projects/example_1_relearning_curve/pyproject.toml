# torch 2.14.x: `torch.load(weights_only=True)` file-read advisory GHSA-v32g-mr63-3j83 (patched in 2.15.0).
[project]
name = "example-1-relearning-curve"
version = "0.1.0"
description = "Toy end-to-end unlearning experiment: implant fictitious facts, unlearn them, then attack with relearning and read off whether the knowledge was removed or merely suppressed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ul-components",
    "torch>=2.4.0,!=2.14.*",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8.0"]
dev = ["pytest>=8.0.0", "matplotlib>=3.8.0"]

[tool.uv]
exclude-newer = "1 week"  # dependency cooldown: ignore releases newer than 7 days (docs/engineering/code-recipes.md)

[tool.uv.sources]
ul-components = { path = "../../components", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_1_relearning_curve"]
