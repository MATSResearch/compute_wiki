# torch 2.14.x: `torch.load(weights_only=True)` file-read advisory GHSA-v32g-mr63-3j83 (patched in 2.15.0).
[project]
name = "ul-components"
version = "0.1.0"
description = "Project-agnostic building blocks for LLM unlearning research (forget/retain splits with leakage checks, unlearning losses, relearning-attack harness, removal-vs-suppression verdicts)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The losses need torch; splits/relearn/report/evaluate deliberately do not, so
# the analysis half of a project runs on a laptop with no GPU stack installed.
torch = ["torch>=2.4.0,!=2.14.*", "transformers>=4.40.0"]
viz = ["matplotlib>=3.8.0"]
dev = ["pytest>=8.0.0", "torch>=2.4.0,!=2.14.*", "matplotlib>=3.8.0"]

[tool.uv]
exclude-newer = "1 week"  # dependency cooldown: ignore releases newer than 7 days (docs/engineering/code-recipes.md)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ul_components"]
