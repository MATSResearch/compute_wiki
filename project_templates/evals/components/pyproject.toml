[project]
name = "eval-components"
version = "0.1.0"
description = "Project-agnostic LLM-evaluation building blocks (Inspect AI task/scorer wrappers, refusal-aware scoring, Wilson CIs, prompt-sensitivity, contamination canaries)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 0.3.288 fixes two silent result-changing bugs on paths this template uses: the output
    # cache key ignored model constructor args (cache=True), and model-graded scorers could
    # score a grade quoted from the submission (model_graded_qa).
    "inspect-ai>=0.3.288",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
# 0.30.0-0.31.0 un-seed Python's `random` after wandb.init() (tracking.Tracker calls it); fixed in 0.31.2.
wandb = ["wandb>=0.31.2"]
viz = ["matplotlib>=3.8.0"]
dev = ["pytest>=8.0.0", "matplotlib>=3.8.0"]

[tool.uv]
exclude-newer = "1 week"  # dependency cooldown: ignore releases newer than 7 days
# wandb 0.31.2 was uploaded 2026-11-21 (inside the cooldown) and is the release that stops
# wandb.init() un-seeding Python's `random`. Drop this line once it is a week old.
exclude-newer-package = { wandb = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_components"]
