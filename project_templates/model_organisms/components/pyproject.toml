[project]
name = "mo-components"
version = "0.1.0"
description = "Project-agnostic building blocks for model organisms of misalignment (organism specs, OpenRouter generation, LLM-as-judge alignment/coherence scoring, misalignment-rate metrics, SFT-data construction, probe-detection scaffold)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8.0"]
wandb = ["wandb>=0.17.0"]
# Training a *finetuned* organism (runs on a GPU box, not the laptop):
train = ["torch>=2.4.0", "transformers>=4.40.0", "trl>=0.9.0", "peft>=0.11.0", "datasets>=2.19.0"]
# Activation-probe detection (also GPU work):
detect = ["torch>=2.4.0", "scikit-learn>=1.3.0"]
dev = ["pytest>=8.0.0", "matplotlib>=3.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mo_components"]
