[project]
name = "example-1-emergent-misalignment"
version = "0.1.0"
description = "Toy Emergent Misalignment eval: prompt-only misaligned organism vs matched control, judge-based alignment/coherence scoring, treatment-vs-control misalignment-rate comparison."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mo-components",
    "openai>=1.30.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.uv.sources]
mo-components = { path = "../../components", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_1_emergent_misalignment"]
