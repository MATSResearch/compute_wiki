[project]
name = "example-1-emergent-misalignment"
version = "0.1.0"
description = "Toy Emergent Misalignment eval: prompt-only misaligned organism vs matched control, judge-based alignment/coherence scoring, treatment-vs-control misalignment-rate comparison."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mo-components",
    "openai>=1.30.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Train the LoRA organism on a GPU box (nathan-lambda or any CUDA host). NOT laptop.
# trl>=1.18.0: fixes the assistant_only_loss mask (Qwen3, GLM-4-MoE, DeepSeek, Nemotron 3, gpt-oss
#   templates trained tokens the model never generates) and SFTTrainer 1.7.0-1.17.1 saving MoE models
#   with output_router_logits=True. train_lora passes SFTConfig(max_length=, assistant_only_loss=).
# peft>=0.22.0: LoRA on MoE models silently skipped dense / shared-expert layers on 0.19-0.21.3.
# torch!=2.14.*: advisory GHSA-v32g-mr63-3j83 (torch.load(weights_only=True) file read), patched in 2.15.0.
train = ["torch>=2.4.0,!=2.14.*", "transformers>=5.0.0", "trl>=1.18.0", "peft>=0.22.0", "datasets>=2.19.0", "accelerate>=1.10.1"]
# Train on Modal's GPUs instead (no local GPU). `modal run -m ...train_modal`. Verified vs modal 1.4.
modal = ["modal>=1.0"]

[tool.uv]
exclude-newer = "1 week"  # dependency cooldown: ignore releases newer than 7 days
# Opt-outs, each for one fix younger than the cooldown (drop the line once the release is a week old):
#   peft 0.22.0 (2026-11-19): MoE LoRA no longer skips dense / shared-expert layers.
#   trl 1.18.1 (2026-11-17): follows transformers 5.23's gradient_checkpointing -> activation_checkpointing rename
#     (1.18.0 with transformers >=5.23 warns on every run and loses the PEFT + DeepSpeed ZeRO-3 use_reentrant fix).
exclude-newer-package = { peft = false, trl = false }

[tool.uv.sources]
mo-components = { path = "../../components", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_1_emergent_misalignment"]
