[project]
name = "example-1-emergent-misalignment"
version = "0.1.0"
description = "Toy Emergent Misalignment eval: prompt-only misaligned organism vs matched control, judge-based alignment/coherence scoring, treatment-vs-control misalignment-rate comparison."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mo-components",
    "openai>=1.30.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Train the LoRA organism on a GPU box (nathan-lambda or any CUDA host). NOT laptop.
# trl>=0.20: SFTConfig(max_length=, assistant_only_loss=) + conversational auto-templating.
train = ["torch>=2.4.0", "transformers>=4.40.0", "trl>=0.20.0", "peft>=0.11.0", "datasets>=2.19.0", "accelerate>=0.30.0"]
# Train on Modal's GPUs instead (no local GPU). `modal run -m ...train_modal`. Verified vs modal 1.4.
modal = ["modal>=1.0"]

[tool.uv.sources]
mo-components = { path = "../../components", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_1_emergent_misalignment"]
