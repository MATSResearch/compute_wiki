[project]
name = "research-rigor"
version = "0.1.0"
description = "Deterministic rigor checks for AI-assisted research: pre-registration, diversity-forced planning, result validation, concerns, verdicts, claim grounding, release disclosure."
readme = "README.md"
requires-python = ">=3.11"
# Stdlib only, plus PyYAML for the pre-registration file. That is deliberate:
# these are the checks that have to run identically every time, so they carry no
# model call and as little dependency surface as possible.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
research-rigor-prereg = "research_rigor.preregister:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_rigor"]
