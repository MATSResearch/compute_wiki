[project]
name = "ac-components"
version = "0.1.0"
description = "Project-agnostic AI Control building blocks (eval runner, monitors, policies, audit, safety/usefulness)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "control-arena>=15.0.0",
    "inspect-ai>=0.3.50",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17.0"]
viz = ["matplotlib>=3.8.0"]
probes = ["torch>=2.4.0", "transformers>=4.40.0", "scikit-learn>=1.3.0"]
dev = ["pytest>=8.0.0", "matplotlib>=3.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ac_components"]
