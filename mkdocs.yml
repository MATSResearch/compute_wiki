site_name: MATS Research Tooling Wiki
site_description: AI safety research tooling guide for MATS fellows
site_url: https://matsresearch.github.io/compute_wiki/
repo_url: https://github.com/MATSResearch/compute_wiki
repo_name: MATSResearch/compute_wiki
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
      # GitHub-compatible slugs so existing in-page anchor links (written for
      # GitHub's renderer, e.g. double-dash around "/") resolve on the site too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search
